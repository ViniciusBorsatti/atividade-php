services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loja
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"

  app:
    build: .
    working_dir: /app
    command: php -S 0.0.0.0:8000
    volumes:
      - "./atividade 2:/app"
    ports:
      - "8000:8000"
